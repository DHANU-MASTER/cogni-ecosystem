<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030d25"/>
      <stop offset=".48" stop-color="#071936"/>
      <stop offset="1" stop-color="#120b35"/>
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#59f4ff"/>
      <stop offset=".52" stop-color="#2aa9ff"/>
      <stop offset="1" stop-color="#b35cff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff9b35"/>
      <stop offset=".55" stop-color="#a942ff"/>
      <stop offset="1" stop-color="#5a65ff"/>
    </linearGradient>
    <linearGradient id="cardCyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071f42"/>
      <stop offset="1" stop-color="#07142e"/>
    </linearGradient>
    <linearGradient id="cardPurple" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1b1645"/>
      <stop offset="1" stop-color="#0d1434"/>
    </linearGradient>
    <filter id="glowCyan" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="circuit" width="90" height="90" patternUnits="userSpaceOnUse">
      <path d="M10 10h25v18h25v25h20M80 76H57V55H35V35H10" fill="none" stroke="#1b78bc" stroke-opacity=".15" stroke-width="2"/>
      <circle cx="10" cy="10" r="3" fill="#59f4ff" fill-opacity=".26"/>
      <circle cx="80" cy="76" r="3" fill="#b35cff" fill-opacity=".24"/>
    </pattern>
    <style>
      .sans{font-family:DejaVu Sans,Arial,sans-serif}
      .bold{font-family:DejaVu Sans,Arial,sans-serif;font-weight:700}
      .hand{font-family:cursive;font-style:italic}
      .white{fill:#f4fbff}
      .muted{fill:#a8c8e8}
      .cyan{fill:#65f4ff}
      .purpleText{fill:#d29bff}
      .small{font-size:20px;letter-spacing:1px}
    </style>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>
